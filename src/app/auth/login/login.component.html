<div class="relative flex min-h-screen flex-col justify-between overflow-hidden bg-[linear-gradient(135deg,#fff7fb_0%,#fbe2ee_48%,#fff4fa_100%)] px-4">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#f3c5dd_3px,transparent_3px)] [background-size:34px_34px]"></div>
    <div class="absolute -left-20 top-4 h-72 w-72 rounded-full bg-[#f2bfd8]/55 blur-3xl"></div>
    <div class="absolute right-0 top-0 h-96 w-96 rounded-full bg-white/40 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-[#f7d1e3]/55 blur-3xl"></div>
  </div>

  <div class="relative flex flex-1 items-center justify-center py-8">
  <div class="w-full max-w-md">
    <div class="rounded-[2.5rem] border border-white/90 bg-white/92 p-8 text-center shadow-[0_20px_60px_rgba(230,145,185,0.2)] backdrop-blur-xl">
      <div class="mx-auto mb-6 h-1 w-24 rounded-full bg-gradient-to-r from-transparent via-[#ec9fc5] to-transparent"></div>

      <div class="mx-auto flex h-28 w-28 items-center justify-center rounded-[2rem] border border-[#f3c6dc] bg-white shadow-[0_12px_28px_rgba(230,145,185,0.18)]">
        <img
          src="assets/img/Logo.jpeg"
          alt="Sweet Taste"
          class="max-h-full max-w-full object-contain p-2"
        />
      </div>

      <h1 class="mt-6 text-4xl font-black tracking-[0.24em] text-[#e45298]">
        SWEET TASTE
      </h1>

      <p class="mt-2 text-xs uppercase tracking-[0.42em] text-[#b84d81]">
        Pasteleria artesanal
      </p>

      <div class="mx-auto mt-5 h-px w-24 bg-gradient-to-r from-transparent via-[#ec9fc5] to-transparent"></div>

      <p class="mt-6 text-sm leading-6 text-[#4f3b45]">
        Tortas, cupcakes y postres personalizados para celebraciones, regalos y antojos de todos los dias.
      </p>

      <button
        type="button"
        (click)="entrar()"
        class="mt-8 w-full rounded-2xl bg-gradient-to-r from-[#d94d91] via-[#e86cab] to-[#f09ac3] px-4 py-3 text-base font-bold text-white shadow-[0_10px_30px_rgba(217,77,145,0.32)] transition duration-300 hover:scale-[1.02] hover:shadow-[0_14px_40px_rgba(217,77,145,0.4)]"
      >
        Entrar al panel
      </button>

      <p class="mt-6 text-xs tracking-[0.18em] text-[#b84d81]">
        Tortas - Cupcakes - Postres personalizados
      </p>
    </div>
  </div>
</div>

  <app-footer />
</div>
